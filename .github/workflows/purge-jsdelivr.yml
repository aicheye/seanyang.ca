name: Purge jsDelivr

# When data/ files chagne on main, tell jsDelivr to re-fetch the
# edited files without waiting for the CDN TTL.
on:
  push:
    branches: [main]
    paths:
      - 'public/data/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed data files
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ] \
             || [ -z "${BASE:-}" ] \
             || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # No usable diff base (manual run, new branch, or force-push) —
            # purge every data file to be safe.
            files=$(ls public/data/*.json)
          else
            files=$(git diff --name-only "$BASE" "$HEAD" -- 'public/data/')
          fi
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Changed data files:"; echo "$files"

      # jsDelivr re-fetches from GitHub when purged, and right after a push
      # GitHub can still return the previous commit for @main. A purge two
      # seconds after the #65 merge re-cached the old jobs.json. Purge now,
      # wait, purge again.
      - name: Purge jsDelivr cache
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -uo pipefail
          status=0
          purge_all() {
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}"
              echo "Purging ${url}"
              if ! curl -fsS --retry 3 --retry-delay 2 "$url"; then
                echo "::warning::purge request failed for ${f}"
                status=1
              fi
              echo
            done <<< "$FILES"
          }
          purge_all
          echo "Waiting 90s for GitHub to serve the new commit, then purging again"
          sleep 90
          purge_all
          exit $status
