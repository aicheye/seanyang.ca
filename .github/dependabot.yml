version: 2
updates:
  # Weekly npm updates, grouped into a single PR to keep noise down.
  # Security updates arrive immediately and are not grouped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint only supports TS <6.1; don't propose TS major bumps
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Keep actions in workflows (e.g. actions/checkout) current too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
